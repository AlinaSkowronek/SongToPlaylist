<!DOCTYPE html> <!--Tells internet browser that it is an html document-->
<html> <!--opening tag-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
</head>
<title>Song To Playlist</title> <!--Changes title on tab-->

<body> <!--all visible text goes inside-->
    <ul>
        <li><a class="log-out" href="login.html">Logout</a></li>
    </ul>

    <div class="row">
        <div id="left" class="column">
            <p>Create A New Playlist!</p>
            <div class="record-wrapper">
                <img id="record" src="../assets/images/recordPlayer.png">
                <p>Click here to generate new playlists from your liked songs on Spotify
                </p>
            </div>
            <button onclick="getBigger()">Click Me!</button>
        </div>
        <div id="right" class="column">
            <p>View Existing Playlists!</p>
            <div class="ipod-wrapper">
                <img id="ipod" src="../assets/images/ipod.png">
                <p>Click here to view and enjoy previously generated playlists
                </p>
            </div>
            <button onclick="getBigger()">Click Me!</button>
        </div>
    </div>

</body>


</html>
